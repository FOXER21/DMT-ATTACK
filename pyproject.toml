[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmt-vla"
version = "0.1.0"
description = "DMT: diffusion-prior adversarial texture search for closed-loop VLA patch attacks."
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
dmt-train = "dmt.training.train_generator:main"
dmt-train-ppo = "dmt.training.train_ppo:main"
dmt-infer = "dmt.inference.texture:main"
dmt-evaluate = "dmt.rollout.evaluate_policy:main"
dmt-prepare-scene = "dmt.scene.prepare:main"
dmt-check = "dmt.environment.check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/dmt/runtime"]
